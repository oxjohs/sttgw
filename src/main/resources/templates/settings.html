<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STTGateway Settings</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body class="settings-page">
<div class="page-shell">
    <header class="page-header">
        <div class="brand-block">
            <p class="eyebrow">Configuration Console</p>
            <h1>STT 설정</h1>
            <p class="lede">현재 활성 STT 벤더, 언어 코드, 인증 경로를 조정하고 즉시 반영합니다.</p>
        </div>
        <nav class="header-actions">
            <a class="ghost-link" th:href="@{/}">대시보드로 돌아가기</a>
        </nav>
    </header>

    <main class="settings-grid">
        <section class="surface-panel form-panel">
            <div class="panel-header">
                <div>
                    <p class="panel-kicker">Current Config</p>
                    <h2>STT Vendor Settings</h2>
                </div>
            </div>

            <form id="stt-settings-form" class="settings-form">
                <label>
                    <span>Vendor</span>
                    <select id="vendorName" name="vendorName">
                        <option th:each="vendor : ${vendors}" th:value="${vendor}" th:text="${vendor}"
                                th:selected="${vendor == currentConfig.vendorName}">GOOGLE</option>
                    </select>
                </label>

                <label>
                    <span>Language Code</span>
                    <input id="languageCode" name="languageCode" type="text" th:value="${currentConfig.languageCode}">
                </label>

                <label>
                    <span>Credential Path</span>
                    <input id="credentialPath" name="credentialPath" type="text" th:value="${currentConfig.credentialPath}">
                </label>

                <label>
                    <span>Extra Config</span>
                    <textarea id="extraConfig" name="extraConfig" rows="6" th:text="${currentConfig.extraConfig}"></textarea>
                </label>

                <div class="toggle-row">
                    <label class="toggle-field">
                        <input id="streamingEnabled" name="streamingEnabled" type="checkbox"
                               th:checked="${currentConfig.streamingEnabled}">
                        <span>Streaming Enabled</span>
                    </label>

                    <label class="toggle-field">
                        <input id="active" name="active" type="checkbox"
                               th:checked="${currentConfig.active}">
                        <span>Active</span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="primary-button">설정 저장</button>
                    <p id="settings-feedback" class="feedback-text">저장 대기 중</p>
                </div>
            </form>
        </section>

        <aside class="surface-panel note-panel">
            <div class="panel-header">
                <div>
                    <p class="panel-kicker">Operational Note</p>
                    <h2>적용 범위</h2>
                </div>
            </div>
            <ul class="note-list">
                <li>현재 화면은 DB 기준 기본 STT 설정을 조회/수정합니다.</li>
                <li>실제 recognize 호출은 STT 어댑터 구현 차수 이후 완전하게 연결됩니다.</li>
                <li>운영 경로와 인증키 파일은 배포 문서 기준을 유지해야 합니다.</li>
            </ul>
        </aside>
    </main>
</div>

<script th:src="@{/js/settings.js}"></script>
</body>
</html>
